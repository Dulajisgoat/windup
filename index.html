/* ===== Study Rooms ===== */
const RM=()=>{const l=LAB();return l.rooms||(l.rooms={code:'',done:0,claimed:{}})};
const ROOMS={key:'windup_rooms',
all(){try{return JSON.parse(localStorage.getItem(this.key)||'{}')}catch(e){return{}}},
get(c){return this.all()[c]||null},
put(r){const m=this.all();m[r.code]=r;try{localStorage.setItem(this.key,JSON.stringify(m))}catch(e){}try{this.bc&&this.bc.postMessage(r.code)}catch(e){}},
merge(a,b){if(!a)return b;if(!b)return a;const r={...((a.v||0)>=(b.v||0)?a:b)};r.members={};for(const id of new Set([...Object.keys(a.members||{}),...Object.keys(b.members||{})])){const x=(a.members||{})[id],y=(b.members||{})[id];r.members[id]=x&&y?(x.ts>=y.ts?x:y):(x||y)}return r},
async sync(c,mut){let r=this.get(c);if(mut&&r)mut(r);if(r)this.put(r);if(BACKEND.enabled&&BACKEND.getDoc){const rem=await BACKEND.getDoc('rooms',c);const m=this.merge(r,rem);if(m){this.put(m);r=m;if(mut||!rem||JSON.stringify(rem.members)!==JSON.stringify(m.members))BACKEND.putDoc('rooms',c,m)}}return r},
async join(c){let r=this.get(c);if(!r&&BACKEND.enabled&&BACKEND.getDoc)r=await BACKEND.getDoc('rooms',c);return r}};
try{ROOMS.bc=new BroadcastChannel('windup-rooms');ROOMS.bc.onmessage=()=>rmPaint()}catch(e){}
addEventListener('storage',e=>{if(e.key===ROOMS.key)rmPaint()});
const rmCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>a[Math.floor(Math.random()*a.length)]).join('')};
const rmBeat=r=>{r.members=r.members||{};const u=me();r.members[u.id]={n:u.name,ts:Date.now()}};
const rmOnline=r=>Object.entries(r.members||{}).filter(([,m])=>Date.now()-m.ts<25000);
function rmHTML(){const st=RM(),r=st.code&&ROOMS.get(st.code);
if(!r){return`<div class="px-grid"><div class="card pad"><span class="badge warn">Study rooms</span><h2 style="margin:10px 0 4px">Focus together</h2><p class="muted">Create a room, share the code and everyone's timer starts at the same moment. Finish a session to earn XP.</p>
<form data-form="rm-create" class="stack"><label class="field"><span>Room name</span><input class="input" name="name" required maxlength="40" placeholder="e.g. Maths revision crew"></label><label class="field"><span>Session length</span><select class="select" name="mins"><option value="15">15 minutes</option><option value="25" selected>25 minutes</option><option value="50">50 minutes</option></select></label><button class="btn primary lg">Create a room</button></form></div>
<div class="card pad"><h3 style="margin:0 0 6px">Join with a code</h3><form data-form="rm-join" class="row"><input class="input" name="code" required maxlength="5" placeholder="ABCDE" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700" aria-label="Room code"><button class="btn primary">Join</button></form><p class="faint sm" style="margin-top:14px">${BACKEND.enabled?'Connected: friends on other devices can join with the same code.':'Right now rooms work between tabs on this device. Connect Supabase and friends on other devices can join too.'}</p></div></div>`}
const on=rmOnline(r),now=Date.now(),end=r.startAt?r.startAt+r.mins*60000:0,left=r.startAt?Math.max(0,(end-now)/1000):r.mins*60,run=r.startAt&&now<end,fin=r.startAt&&now>=end,pct=r.startAt?Math.min(100,(now-r.startAt)/(r.mins*600)):0;
return`<div class="rm-wrap"><div class="card pad rm-main"><div class="row wrap"><div><span class="badge ${run?'ok':'info'}">${run?'In session':fin?'Session complete':'Waiting to start'}</span><h2 style="margin:8px 0 0">${esc(r.name)}</h2></div><div class="right row"><button class="btn sm" data-act="rm-copy">Code: <b>${r.code}</b></button><button class="btn sm" data-act="rm-leave">Leave</button></div></div>
<div class="rm-ring" style="--p:${pct}"><div><b id="rm-t">${fmtX(left)}</b><span>${run?'stay focused':fin?'well done!':r.mins+' minute session'}</span></div></div>
<div class="row" style="justify-content:center">${run?'<span class="muted">Everyone in the room sees this same clock.</span>':`<button class="btn primary lg" data-act="rm-start">${fin?'Start another session':'Start for everyone'}</button>`}</div></div>
<div class="card pad"><h3 style="margin:0 0 10px">In the room (${on.length})</h3><div class="rm-mem">${on.map(([id,m])=>`<div class="rm-m ${run?'foc':''}"><span class="avatar" style="width:34px;height:34px;font-size:13px">${esc(initials(m.n))}</span><b>${esc(m.n)}${id===me().id?' (you)':''}</b><em>${run?'focusing':'here'}</em></div>`).join('')||'<p class="muted sm">Just you so far.</p>'}</div><p class="faint sm" style="margin-top:12px">Share the code <b>${r.code}</b> with friends.</p></div></div>`}
function rmPaint(){const a=$('#rm-area');if(!a||!me())return;const st=RM(),r=st.code&&ROOMS.get(st.code);
if(r){const now=Date.now(),end=r.startAt?r.startAt+r.mins*60000:0;if(r.startAt&&now>=end){const k=r.code+'@'+r.startAt;if(!st.claimed[k]){st.claimed[k]=1;st.done++;const l=LAB();l.focus.n++;l.focus.min+=r.mins;addXP(15+Math.floor(r.mins/5));persist();confetti();toast('Room session complete!')}}}
a.innerHTML=rmHTML()}
labForms['rm-create']=async(f,fd)=>{const r={code:rmCode(),name:String(fd.get('name')).trim(),mins:+fd.get('mins')||25,startAt:0,v:1,members:{}};rmBeat(r);ROOMS.put(r);RM().code=r.code;persist();if(BACKEND.enabled&&BACKEND.putDoc)BACKEND.putDoc('rooms',r.code,r);rmPaint();rmMount()};
labForms['rm-join']=async(f,fd)=>{const c=String(fd.get('code')).trim().toUpperCase(),r=await ROOMS.join(c);if(!r)return toast('No room with that code. Check it and try again.','warn');rmBeat(r);ROOMS.put(r);RM().code=c;persist();await ROOMS.sync(c,x=>rmBeat(x));rmPaint();rmMount()};
labActions['rm-start']=async()=>{const c=RM().code;await ROOMS.sync(c,r=>{r.startAt=Date.now();r.v=(r.v||0)+1;rmBeat(r)});rmPaint()};
labActions['rm-leave']=async()=>{const st=RM(),r=ROOMS.get(st.code);if(r&&r.members){delete r.members[me().id];ROOMS.put(r);BACKEND.enabled&&BACKEND.putDoc&&BACKEND.putDoc('rooms',r.code,r)}st.code='';persist();clearInterval(ui.rmi);rmPaint()};
labActions['rm-copy']=()=>{const c=RM().code;navigator.clipboard?.writeText(c).then(()=>toast('Room code copied'),()=>toast('Code: '+c))};
function rmMount(){clearInterval(ui.rmi);if(!$('#rm-area')||!me()||!RM().code)return;let n=0;ui.rmi=setInterval(async()=>{if(!$('#rm-area')){clearInterval(ui.rmi);return}const c=RM().code;if(!c){clearInterval(ui.rmi);return}n++;if(n%5===0)await ROOMS.sync(c,r=>rmBeat(r));else{const r=ROOMS.get(c);if(r){rmBeat(r);ROOMS.put(r)}}rmPaint()},1000)}
V12.rooms=()=>`<div id="rm-area">${rmHTML()}</div>`;

function rdStep(dir,dur){return new Promise(res=>{const b=rdBook(),L=$('#rdL'),R=$('#rdR'),lf=$('#rdLeaf'),bk=$('#rdbook'),cur=b.s[rdCur],nx=b.s[rdCur+dir],fwd=dir>0;
lf.className='rd-leaf go '+(fwd?'f':'b');lf.style.setProperty('--W',($('#rdR').offsetWidth||lf.offsetWidth)+'px');lf.style.setProperty('--dur',dur+'s');
lf.innerHTML=rdStrips(fwd?cur[1]:nx[1],fwd?nx[0]:cur[0]);
if(fwd)R.innerHTML=nx[1];else L.innerHTML=nx[0];
lf.className='rd-leaf go '+(fwd?'f':'b');bk.classList.add('flip');bk.style.setProperty('--dur',dur+'s');
setTimeout(()=>{if(fwd)L.innerHTML=nx[0];else R.innerHTML=nx[1];lf.className='rd-leaf';lf.innerHTML='';bk.classList.remove('flip');rdCur+=dir;rdDots(b,rdCur);
$$('#rdbook [data-count]').forEach(el=>{delete el.dataset.done;animateCount(el)});$$('#rdbook .hl').forEach(h=>h.classList.add('in'));res()},dur*1000+40)})}
async function rdGo(n){const b=rdBook();if(!b||rdBusy)return;n=Math.max(0,Math.min(b.s.length-1,n));if(n===rdCur)return;
if(innerWidth<900||PERF.motionOff()){rdCur=n;rdPaint(b,n);return}
rdBusy=1;const dir=n>rdCur?1:-1,many=Math.abs(n-rdCur)>1;
while(rdCur!==n&&rdBook()===b)await rdStep(dir,many?.62:1.15);rdBusy=0}

'set-progress'(el){API.setProgress(el.dataset.id,el.dataset.v);route()},
'report-open'(el){if(!requireAuth('Sign in to report'))return;simpleForm('Report this resource','report',fld('Reason','reason',`<select class="select" name="reason">${optionList(REASONS)}</select>`)+fld('Details','details',`<textarea class="textarea" name="details" placeholder="Tell us what is wrong (optional)"></textarea>`),'Submit report',el.dataset.id)},
'user-toggle'(el){const u=teacher(el.dataset.id);u.status=u.status==='active'?'suspended':'active';persist();$('#au-table').innerHTML=usersTable();toast(`Account ${u.status==='active'?'reactivated':'suspended'}`)},
async 'user-del'(el){const u=teacher(el.dataset.id),n=S.resources.filter(r=>r.teacherId===u.id).length;if(await confirmBox({title:`Delete ${u.name}?`,message:`This permanently removes the account${n?` and ${plural(n,'resource')}`:''}.`,ok:'Delete',danger:true})){S.resources.filter(r=>r.teacherId===u.id).forEach(r=>API.removeResource(r.id));S.ratings=S.ratings.filter(x=>x.userId!==u.id);S.verifications=S.verifications.filter(v=>v.teacherId!==u.id);delete S.ud[u.id];S.users=S.users.filter(x=>x.id!==u.id);persist();$('#au-table').innerHTML=usersTable();toast('Account deleted')}},
'ver-approve'(el){const v=S.verifications.find(x=>x.id===el.dataset.id);v.status='approved';const t=teacher(v.teacherId);t.verified=true;if(v.school)t.school=v.school;persist();toast('Teacher verified');route()},
'ver-reject'(el){S.verifications.find(x=>x.id===el.dataset.id).status='rejected';persist();route()},
'ver-revoke'(el){const v=S.verifications.find(x=>x.id===el.dataset.id);v.status='rejected';teacher(v.teacherId).verified=false;persist();route()},
'res-approve'(el){const r=getRes(el.dataset.id);r.status='published';r.reviewNote='';persist();toast('Resource published');route()},
'res-reject'(el){simpleForm('Reject resource','reject',fld('Reason shown to the teacher','reason',`<textarea class="textarea" name="reason" required placeholder="e.g. Page 3 is unreadable"></textarea>`),'Reject',el.dataset.id)},
'res-feature'(el){const r=getRes(el.dataset.id);r.featured=!r.featured;persist();route()},
'res-spot'(el){S.spotlight={week:weekKey(),resId:el.dataset.id};persist();toast('Set as this week’s spotlight');route()},
async 'res-remove'(el){const r=getRes(el.dataset.id);if(await confirmBox({title:'Remove resource?',message:`“${r.title}” will be hidden from students. You can restore it later.`,ok:'Remove',danger:true})){r.status='removed';r.reviewNote='Removed by an administrator';persist();route()}},
'res-restore'(el){const r=getRes(el.dataset.id);r.status='published';r.reviewNote='';persist();route()},
async 'report-remove'(el){const p=S.reports.find(x=>x.id===el.dataset.id),r=getRes(p.resId);if(await confirmBox({title:'Remove reported resource?',message:'It will be hidden from students and this report resolved.',ok:'Remove',danger:true})){r.status='removed';r.reviewNote='Removed after a report';p.status='resolved';persist();route()}},
'report-resolve'(el){S.reports.find(x=>x.id===el.dataset.id).status=el.dataset.v;persist();route()},
'req-set'(el){S.requests.find(x=>x.id===el.dataset.id).status=el.dataset.v;persist();route()},
'req-del'(el){S.requests=S.requests.filter(x=>x.id!==el.dataset.id);persist();route()},
'subj-rename'(el){const s=subj(el.dataset.id);simpleForm('Rename subject','subject-rename',fld('Name','name',`<input class="input" name="name" required value="${esc(s.name)}">`),'Save',s.id)},
async 'subj-del'(el){const s=subj(el.dataset.id);if(S.resources.some(r=>r.subject===s.id))return toast('Move or remove its resources before deleting this subject.','err');if(await confirmBox({title:`Delete ${s.name}?`,message:'The subject will be removed from filters and profiles.',ok:'Delete',danger:true})){S.subjects=S.subjects.filter(x=>x.id!==s.id);S.users.forEach(u=>u.subjects=(u.subjects||[]).filter(x=>x!==s.id));persist();route()}},
'topic-del'(el){subj(el.dataset.id).topics.splice(+el.dataset.i,1);persist();route()},
'type-del'(el){const t=el.dataset.t;if(S.resources.some(r=>r.type===t))return toast('That category is still in use.','err');S.types=S.types.filter(x=>x!==t);persist();route()}};

/* ---------- forms ---------- */
const forms={
'global-search'(f,fd){const q=(fd.get('q')||'').trim();goDiscover({q})},'landing-search'(f,fd){goDiscover({q:(fd.get('q')||'').trim()})},
async login(f,fd){const btn=f.querySelector('[type=submit]'),err=$('#lerr');err.textContent='';const un=fd.get('username').trim(),pw=fd.get('password');if(!un||!pw)return err.textContent='Enter your username and password.';
btn.disabled=true;btn.textContent='Signing in…';const r=await Auth.login(un,pw);btn.disabled=false;btn.textContent='Log in';if(r.error)return err.textContent=r.error;const n=ui.next;ui.next=null;toast(r.created?'No account existed, so a new one was created':'Welcome back, '+r.user.name);go(n||'#/overview')},
async signup(f,fd){const role=fd.get('role'),subjects=fd.getAll('subjects'),err=$('#serr'),btn=f.querySelector('[type=submit]');err.textContent='';if(!subjects.length)return err.textContent='Choose at least one subject.';
const un=fd.get('username').trim(),pw=fd.get('password');if(!/^[A-Za-z0-9_.\-]{3,32}$/.test(un))return err.textContent='Username must be 3 to 32 letters, numbers, dots or underscores.';if(pw.length<6)return err.textContent='Password must be at least 6 characters.';
btn.disabled=true;btn.textContent='Creating account…';const r=await Auth.login(un,pw,{name:fd.get('name').trim(),email:(fd.get('email')||'').trim()||un,role,subjects,year:fd.get('year'),board:fd.get('board'),school:(fd.get('school')||'').trim()});btn.disabled=false;btn.textContent='Create account';
if(r.error)return err.textContent=r.error;toast(!r.created?'That username already existed, so you are signed in to it':role==='teacher'?'Account created. Verification request sent.':'Account created');go('#/overview')},
contact(f){toast('Thanks! In this demo the message is not sent anywhere.');f.reset()},
exam(f,fd){UD().exams.push({id:uid('e'),name:fd.get('name').trim(),subject:fd.get('subject'),date:fd.get('date')});persist();closeModal(true);route();toast('Exam added')},
collection(f,fd){const d=UD(),id=f.dataset.id;if(id){const c=d.collections.find(x=>x.id===id);c.name=fd.get('name').trim();c.desc=(fd.get('desc')||'').trim()}else d.collections.push({id:uid('c'),name:fd.get('name').trim(),desc:(fd.get('desc')||'').trim(),items:[]});persist();closeModal(true);route();toast('Collection saved')},
'coll-quick'(f,fd){const d=UD();d.collections.push({id:uid('c'),name:fd.get('name').trim(),desc:'',items:[f.dataset.id]});persist();collModal(f.dataset.id);toast('Added to new collection')},
request(f,fd){S.requests.unshift({id:uid('q'),userId:S.session,title:fd.get('title').trim(),subject:fd.get('subject'),board:fd.get('board'),year:me().year||'',details:(fd.get('details')||'').trim(),votes:[S.session],status:'open',date:new Date().toISOString()});persist();closeModal(true);ui.discoverTab='requests';go('#/discover');route();toast('Request posted')},
report(f,fd){S.reports.push({id:uid('rp'),resId:f.dataset.id,userId:S.session,reason:fd.get('reason'),details:(fd.get('details')||'').trim(),status:'open',date:new Date().toISOString()});persist();closeModal(true);toast('Thanks. An administrator will review this report.')},
rate(f,fd){const s=+fd.get('stars');if(!s)return toast('Choose a star rating first.','warn');API.rate(f.dataset.id,s,(fd.get('comment')||'').trim());toast('Review saved');route()},
verify(f,fd){const u=me();u.school=fd.get('school').trim();S.verifications.push({id:uid('v'),teacherId:u.id,school:u.school,evidence:fd.get('evidence').trim(),note:fd.get('note').trim(),status:'pending',date:new Date().toISOString()});persist();closeModal(true);route();toast('Verification request sent')},
profile(f,fd){const u=me();u.name=fd.get('name').trim();u.email=fd.get('email').trim();u.bio=fd.get('bio').trim();if(fd.has('year'))u.year=fd.get('year');if(fd.has('board'))u.board=fd.get('board');if(fd.has('school'))u.school=fd.get('school').trim();if(u.role!=='admin')u.subjects=fd.getAll('subjects');persist();route();toast('Profile saved')},
upload(f,fd){const u=me(),up=ui.up,ed=up.editId?getRes(up.editId):null,ti=$('#taginput');if(ti&&ti.value.trim())addTag(ti.value);
if(!ed&&!up.file)return $('#uerr').textContent='Please choose a PDF to upload.';if(up.file&&up.progress<100)return toast('Still reading your file, try again in a moment.','warn');
const v=Object.fromEntries(fd),data={title:v.title.trim(),desc:(v.desc||'').trim(),subject:v.subject,topic:v.topic.trim(),type:v.type,difficulty:v.difficulty,year:v.year,board:v.board,acYear:v.acYear,tags:up.tags.slice(0,8)};
if(ed){Object.assign(ed,data);if(ed.status==='rejected'){ed.status=u.verified?'published':'pending';ed.reviewNote=''}if(up.file)attachFile(ed,up);toast('Changes saved')}
else{const r={id:uid('r'),...data,teacherId:u.id,downloads:0,date:new Date().toISOString(),format:'PDF',sizeBytes:up.size,status:u.verified?'published':'pending',featured:false};attachFile(r,up);S.resources.push(r);
const q=up.requestId&&S.requests.find(x=>x.id===up.requestId);if(q&&r.status==='published'){q.status='fulfilled';q.resourceId=r.id}
if(up.data===null)toast('Large file kept for this session only (demo storage limit).','warn');else toast(r.status==='published'?'Resource published':'Submitted for review')}
persist();go('#/uploads')},
'topic-add'(f,fd){const s=subj(f.dataset.id),t=fd.get('t').trim();if(!s.topics.includes(t))s.topics.push(t);persist();route()},
'subject-add'(f,fd){const name=fd.get('name').trim();let id=slug(name);if(subj(id))id+=Math.floor(Math.random()*99);S.subjects.push({id,name,icon:fd.get('icon'),topics:[]});persist();route();toast('Subject added')},
'subject-rename'(f,fd){subj(f.dataset.id).name=fd.get('name').trim();persist();closeModal(true);route()},
'type-add'(f,fd){const t=fd.get('t').trim();if(!S.types.includes(t))S.types.push(t);persist();route()},
reject(f,fd){const r=getRes(f.dataset.id);r.status='rejected';r.reviewNote=fd.get('reason').trim();persist();closeModal(true);route();toast('Resource rejected')}};

/* ---------- global listeners ---------- */
document.addEventListener('click',e=>{
if(!e.target.closest('#umenu,[data-act="user-menu"]'))$('#umenu')?.classList.remove('open');
const rs=e.target.closest('a[data-reset]');if(rs){ui.f=defaultFilters();ui.discoverTab='resources';if(location.hash===rs.getAttribute('href'))route()}
if(e.target.classList&&e.target.classList.contains('overlay'))return closeModal();
const el=e.target.closest('[data-act]');if(el&&actions[el.dataset.act])actions[el.dataset.act](el,e);
if(el&&el.tagName==='A'&&el.closest('#side'))0;if(e.target.closest('#side a')){$('#side')?.classList.remove('open');$('#scrim')?.classList.remove('open')}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=forms[f.dataset.form];h&&h(f,new FormData(f))});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='q'){clearTimeout(ui.qt);ui.qt=setTimeout(()=>{ui.f.q=t.value;ui.f.page=1;renderResults()},160)}
if(t.dataset.live==='users'){ui.au.q=t.value;$('#au-table').innerHTML=usersTable()}});
const changes={
'signup-role'(t){const r=t.value;$('#su-student').hidden=r!=='student';$('#su-teacher').hidden=r!=='teacher';$('#su-sl').textContent=r==='teacher'?'Subjects you teach':'Subjects you study';$('input[name=name]').placeholder=r==='teacher'?'Ms Jane Smith':'Jane Smith'},
progress(t){API.setProgress(t.dataset.id,t.value);toast('Progress updated');if(location.hash==='#/library')route()},
'up-subject'(t){const tp=subj(t.value)?.topics||[];$('#topiclist').innerHTML=tp.map(x=>`<option value="${esc(x)}">`).join('')},
pref(t){UD().prefs[t.dataset.k]=t.checked;persist();toast('Preference saved')},
'au-role'(t){ui.au.role=t.value;$('#au-table').innerHTML=usersTable()},
'coll-toggle'(t){const c=UD().collections.find(x=>x.id===t.dataset.c),id=t.dataset.id;c.items=t.checked?[...new Set([...c.items,id])]:c.items.filter(x=>x!==id);persist();toast(t.checked?`Added to ${c.name}`:`Removed from ${c.name}`)}};
document.addEventListener('change',e=>{const t=e.target;
if(t.type==='radio'&&t.closest('#roleseg')){$$('#roleseg label').forEach(l=>l.classList.toggle('on',l.contains(t)&&t.checked))}
if(t.dataset.f&&t.dataset.f!=='q'){ui.f[t.dataset.f]=t.value;ui.f.page=1;if(t.dataset.f==='subject')ui.f.topic='';refreshLibrary()}
if(t.dataset.change&&changes[t.dataset.change])changes[t.dataset.change](t);
if(t.id==='fileinput'){handleFile(t.files[0]);t.value=''}});
document.addEventListener('dragover',e=>{const z=e.target.closest('#dz');if(z){e.preventDefault();$('#dzone')?.classList.add('over')}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#dz'))$('#dzone')?.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest('#dz');if(z){e.preventDefault();$('#dzone')?.classList.remove('over');handleFile(e.dataTransfer.files[0])}});
document.addEventListener('keydown',e=>{const t=e.target;
if(e.key==='Escape'){closeModal();$('#umenu')?.classList.remove('open')}
if(t.id==='taginput'){if(e.key==='Enter'||e.key===','){e.preventDefault();if(t.value.trim())addTag(t.value)}else if(e.key==='Backspace'&&!t.value&&ui.up.tags.length){ui.up.tags.pop();renderTags();$('#taginput').focus()}}
if(t.id==='dzone'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#fileinput').click()}
if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){const g=$('#gsearch');if(g){e.preventDefault();g.focus()}}});
Object.assign(actions,labActions);Object.assign(forms,labForms);Object.assign(changes,labChanges);
window.addEventListener('hashchange',route);
S.users=S.users.filter(u=>u.authId||u.email!=='admin@demo.windup');if(S.session&&!S.users.some(u=>u.id===S.session))S.session=null;
{const cu=me();if(cu&&cu.authId&&!Auth.signedIn()){S.session=null;persist()}}
route();
</script>
</body>
